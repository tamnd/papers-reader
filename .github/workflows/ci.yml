name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing in this workflow writes anything, so nothing in it gets a write
# token. A job that needs one asks for it by name.
permissions:
  contents: read

# A push that lands while an older run is still going cancels it, except on
# main, where every commit gets a result of its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GO_VERSION: "1.27.1"
  NODE_VERSION: "26"

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: build
        run: go build -trimpath ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # Pinned, and it has to be a release that knows about the Go version
      # above. staticcheck reads the compiler's export data and a release
      # older than the toolchain gives up with "export data version 4 is
      # greater than maximum supported version 2" rather than a finding.
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - run: staticcheck ./...

  # The toolchain exists to build one specific corpus, so the thing worth
  # testing is that it can read that corpus. This checks out tamnd/papers and
  # runs the audit over it.
  #
  # Without --hard on purpose. A rule that fails here is a fact about the
  # content of tamnd/papers and not about this program, and that repository
  # runs the same audit with --hard and fails its own build on it. Failing
  # this one as well would mean every pull request to the toolchain was red
  # until somebody re-extracted a paper, which is how a red build stops
  # meaning anything. What this job asserts is that the audit runs to the end
  # over the real corpus, which is what catches a rule that panics on data no
  # test fixture has.
  corpus:
    name: audit the corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: papers-reader
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamnd/papers
          persist-credentials: false
          path: papers
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: build
        working-directory: papers-reader
        run: go build -trimpath -o /usr/local/bin/papers ./cmd/papers
      - name: list
        env:
          PAPERS_CORPUS: ${{ github.workspace }}/papers
        run: papers list --count
      - name: audit
        env:
          PAPERS_CORPUS: ${{ github.workspace }}/papers
        run: papers audit
      - name: coverage
        env:
          PAPERS_CORPUS: ${{ github.workspace }}/papers
        run: papers report coverage --quiet

  # The reading app, built the way the deploy builds it: emit the real
  # corpus and then run the app over what came out. Building it against a
  # fixture would test the app against the only input that cannot surprise
  # it, and the emit and the app are held together by a schema that either
  # of them can be changed out from under.
  web:
    name: build the reading app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: papers-reader
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamnd/papers
          persist-credentials: false
          path: papers
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: papers-reader/web/package-lock.json
      - name: emit
        working-directory: papers-reader
        run: |
          go build -trimpath -o /usr/local/bin/papers ./cmd/papers
          papers emit -corpus ${{ github.workspace }}/papers -out web/public
      - name: install
        working-directory: papers-reader/web
        run: npm ci
      # The types are generated from the schema and committed, so that a
      # reader of the app can see what it reads. This is what stops the
      # committed copy from being an old one.
      - name: the generated types are current
        working-directory: papers-reader/web
        run: |
          npm run schema
          git diff --exit-code -- src/types.gen.ts
      - name: build
        working-directory: papers-reader/web
        run: npm run build
